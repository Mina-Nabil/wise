<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Wise Car Pricing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first instrument panel. Search/voice bar on top, stepped picker, ranked quote cards (side by side on wide screens). */
:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#5A6879; --line:#DDE3EA;
  --route:#1E4FD6; --route-soft:#E7EEFF; --signal:#F4B000; --signal-soft:#FFF4D6; --signal-ink:#3A2A00;
  --good:#127A4B; --bad:#B4362B; --bad-soft:#FBECEA;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0A111D; --surface:#121C2C; --ink:#E9EEF6; --muted:#93A1B5; --line:#24324A;
  --route:#7FA3FF; --route-soft:#1A2A4D; --signal:#FFC53D; --signal-soft:#3A2D0A; --signal-ink:#FFE7A6;
  --good:#4CC38A; --bad:#FF8A7E; --bad-soft:#3A1A18; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0A111D; --surface:#121C2C; --ink:#E9EEF6; --muted:#93A1B5; --line:#24324A;
  --route:#7FA3FF; --route-soft:#1A2A4D; --signal:#FFC53D; --signal-soft:#3A2D0A; --signal-ink:#FFE7A6;
  --good:#4CC38A; --bad:#FF8A7E; --bad-soft:#3A1A18; color-scheme:dark }
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brandmark{display:flex;align-items:center;gap:10px}
.brandmark .logo{width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.wisemark{background:#341439;border-radius:12px;padding:7px 10px;display:flex;align-items:center}
.wisemark img{height:38px;width:auto;display:block}
.brandmark h1[dir=ltr]{white-space:nowrap}
@media (max-width:440px){.wisemark img{height:32px}.brandmark h1[dir=ltr]{font-size:16px}.stamp{font-size:11px}}
.brandmark h1{font-family:var(--display);font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.brandmark small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.stamp{font-size:12px;color:var(--muted);text-align:left}

/* voice / search bar */
.ask{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:10px;display:flex;gap:8px;align-items:center;box-shadow:0 1px 0 rgba(15,27,45,.04)}
.ask:focus-within{border-color:var(--route)}
.ask input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-family:var(--display);font-size:17px;padding:8px 6px}
.ask input::placeholder{color:var(--muted);opacity:.8}
.iconbtn{flex:none;width:46px;height:46px;border-radius:13px;border:0;display:grid;place-items:center;cursor:pointer;background:var(--route-soft);color:var(--route)}
.iconbtn.go{background:var(--route);color:#fff}
.iconbtn.live{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
.iconbtn:focus-visible,.chip:focus-visible,.tile:focus-visible,button:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hint b{color:var(--ink);font-weight:500}
.heard{margin:8px 4px 0;font-size:13px;color:var(--good)}
.heard.warn{color:var(--bad)}

.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}
.grid>*{min-width:0}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:start}.results{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step{border-top:1px solid var(--line);padding:14px 16px}
.step:first-child{border-top:0}
.step-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px}
.step-h .lbl{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:500;font-size:15px}
.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.step.done .num{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.picked{font-family:var(--display);font-weight:600;color:var(--route);font-size:15px;background:none;border:0;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:6px}
.picked .ed{font-size:12px;color:var(--muted);font-weight:400;font-family:var(--body)}
.body{margin-top:12px}
.filter{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 12px;font-family:var(--body);font-size:15px;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:330px;overflow:auto;padding:2px}
.tile{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--body);min-width:0}
.tile:hover{border-color:var(--route)}
.mono{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.02em;background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.tile .tn{font-size:12.5px;font-weight:500;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.tile .ta{font-size:11px;color:var(--muted);line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-height:300px;overflow:auto;padding:2px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-family:var(--display);font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--route)}
.chip.on{background:var(--route);border-color:var(--route);color:#fff}
.chip.dim{opacity:.55}
.chip.sug{border-color:var(--route);background:var(--route-soft)}
.eng{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.engsw{display:inline-flex;gap:3px;padding:3px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.engsw button{border:0;background:none;padding:5px 12px;border-radius:999px;font-family:var(--display);font-size:13px;color:var(--muted);cursor:pointer}
.engsw button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.engsw button.on.ev{background:var(--route-soft);color:var(--route)}
.eng.ev{background:var(--route-soft);border-color:transparent;color:var(--route)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.valuebox{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--paper)}
.valuebox:focus-within{border-color:var(--route)}
.valuebox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:right;padding:6px 0}
.valuebox span{color:var(--muted);font-size:14px}
.words{font-family:var(--display);color:var(--route);font-size:14px;margin-top:6px;min-height:22px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.quick .chip{padding:6px 11px;font-size:13px}

/* results */
.results .head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.results h2{font-family:var(--display);font-size:17px;font-weight:600;margin:0;text-wrap:balance}
.results .sub{color:var(--muted);font-size:13px}
.speak{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font-family:var(--display);font-size:13px;cursor:pointer}
.cards{display:flex;flex-direction:column;gap:10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center}
.q .rank{grid-row:span 2;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:600;background:var(--paper);color:var(--muted);font-variant-numeric:tabular-nums}
.q .who{font-family:var(--display);font-weight:600;font-size:16px;min-width:0}
.q .who small{font-weight:400;color:var(--muted);font-size:12.5px;margin-inline-start:6px}
.q .amt{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;text-align:left;white-space:nowrap}
.q .amt small.gl{font-family:var(--body);font-weight:600;font-size:11.5px;margin-right:6px;margin-left:0;vertical-align:4px}
.q .amt small{font-size:12px;font-weight:400;color:var(--muted);margin-inline-start:3px}
.q .meta{font-size:12.5px;color:var(--muted);min-width:0}
.q .netline{font-size:12.5px;color:var(--muted);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.q.best{border:1.5px solid var(--signal);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.q.best .rank{background:var(--signal);color:var(--signal-ink)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--signal-soft);color:var(--signal-ink);margin-inline-start:6px;vertical-align:2px;font-family:var(--body)}
.rates{display:flex;gap:12px;flex-wrap:wrap;grid-column:2 / -1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
.rates b{color:var(--ink);font-weight:600}
.out{margin-top:14px}
.out h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px;font-family:var(--display)}
.outrow{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:var(--bad-soft);margin-bottom:6px;font-size:13px}
.outrow b{font-family:var(--display);font-weight:500;white-space:nowrap}
.outrow span{color:var(--muted);text-align:left;min-width:0}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:16px;margin-bottom:4px}
.foot{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.7}
.example{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--signal-soft);color:var(--signal-ink);margin-inline-start:6px}
.sortsw{display:inline-flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--display);font-size:14px;cursor:pointer;user-select:none}
.sortsw input{position:absolute;opacity:0;width:1px;height:1px}
.sortsw .trk{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
.sortsw .trk::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:inset-inline-start .15s}
.sortsw input:checked + .trk{background:var(--route)}
.sortsw input:checked + .trk::after{inset-inline-start:21px}
.sortsw input:focus-visible + .trk{outline:2px solid var(--route);outline-offset:2px}
.voicerow.warnv{color:var(--ink);background:var(--signal-soft);border-radius:10px;padding:8px 10px}
.reset{border:0;background:none;color:var(--route);font-family:var(--display);font-size:13px;cursor:pointer;padding:4px}

/* ask Claude (only inside Claude, uses the viewer's own Claude) */
.ai{margin-top:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px}
.ai-h{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.ai-h b{font-family:var(--display);font-weight:600;font-size:15px;color:#341439}
.ai-h span{font-size:12.5px;color:var(--muted)}
.ai-log{display:flex;flex-direction:column;gap:8px;max-height:min(55vh,520px);overflow:auto;overscroll-behavior:contain}
.ai-log:empty{display:none}
.ai-m{padding:9px 12px;border-radius:14px;white-space:pre-wrap;line-height:1.6;font-size:14.5px;max-width:92%;overflow-wrap:anywhere}
.ai-m.u{align-self:flex-start;background:var(--route-soft);color:var(--ink)}
.ai-m.a{align-self:flex-end;background:var(--paper);border:1px solid var(--line)}
.ai-m.a.wait{color:var(--muted)}
.ai-f{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.ai-f textarea{flex:1;min-width:0;resize:none;border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink);max-height:120px}
.ai-f button{flex:none;height:44px;padding:0 16px;border-radius:13px;border:0;font:inherit;font-weight:600;cursor:pointer;background:#341439;color:#fff}
.ai-f #aiStop{background:var(--bad-soft);color:var(--bad)}
.ai-f button:disabled{opacity:.5;cursor:default}
.ai-note{font-size:12px;color:var(--muted);margin-top:6px}
.ai-note:empty{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ai-h b{color:#E3C7EA}}
:root[data-theme="dark"] .ai-h b{color:#E3C7EA}
/* benefits comparison */
.ben{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ben-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.ben-h h3{margin:0;font-family:var(--display);font-size:16px;font-weight:600}
.ben-h .sub{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 16px 10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:0}
.tablewrap{overflow:auto;max-height:min(70vh,640px);overscroll-behavior:contain;border-top:1px solid var(--line)}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;min-width:640px;font-size:13px}
.cmp th,.cmp td{padding:10px 12px;text-align:right;vertical-align:top;border-bottom:1px solid var(--line)}
.cmp thead th{background:var(--paper);font-family:var(--display);font-weight:600;font-size:13px;white-space:nowrap;position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}
.cmp thead th small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.cmp thead th.best-col{background:var(--signal-soft)}
.cmp th[scope=row]{position:sticky;right:0;background:var(--surface);font-weight:600;font-family:var(--display);min-width:120px;max-width:150px;box-shadow:-1px 0 0 var(--line);z-index:1}
.cmp thead th:first-child{position:sticky;right:0;z-index:3;box-shadow:-1px 0 0 var(--line),0 1px 0 var(--line)}
.cmp td{min-width:130px;line-height:1.45}
.cmp tr:last-child td,.cmp tr:last-child th{border-bottom:0}
.cell{display:flex;gap:7px;align-items:flex-start}
.cell i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px}
.t-g{background:var(--good)} .t-w{background:var(--signal)} .t-n{background:var(--line)}
.cell.none{color:var(--muted)}
.same{padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.same b{color:var(--ink);font-family:var(--display);font-weight:500}
.cmp abbr{text-decoration:none;cursor:help}
.swipe{font-size:12px;color:var(--muted);padding:8px 16px;border-top:1px solid var(--line)}
@media (min-width:900px){.swipe{display:none}}
.voicerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-2px 0 10px}
.voicerow select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 10px;font-family:var(--body);font-size:13px;max-width:100%}

/* login */
.login{display:grid;place-items:center;padding-block:6vh 10vh}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.login-card h2{margin:0;font-family:var(--display);font-size:20px;font-weight:600}
.login-card .sub{margin:0 0 6px;color:var(--muted);font-size:13px}
.login-card label{font-size:13px;font-weight:500;margin-top:6px}
.login-card input[type=text],.login-card input:not([type]),.login-card input[type=password]{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:16px;font-family:var(--display);text-align:left}
.login-card input:focus{outline:0;border-color:var(--route)}
.login-card .remember{display:flex;align-items:center;gap:8px;font-weight:400;color:var(--muted)}
.login-card button{margin-top:10px;border:0;border-radius:12px;background:var(--route);color:#fff;font-family:var(--display);font-size:16px;font-weight:600;padding:12px;cursor:pointer}
.login-card button:disabled{opacity:.7}
.lerr{color:var(--bad);font-size:13px;min-height:18px}

/* type-ahead */
.sugg{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(15,27,45,.08)}
.sg{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:10px;cursor:pointer;text-align:right;font-family:var(--body)}
.sg:hover,.sg:focus-visible{background:var(--route-soft)}
.sgt{font-family:var(--display);font-weight:600;font-size:15px}
.sgs{color:var(--muted);font-size:12.5px;margin-inline-start:auto}
.mono.sm{width:28px;height:28px;border-radius:8px;font-size:11px}
.mono.logo{background:var(--surface)}
.mono.logo svg{width:62%;height:62%;fill:var(--ink)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" dir="rtl" id="app">
